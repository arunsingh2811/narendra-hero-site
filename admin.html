<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Staff Admin - Narendra Hero</title>
<link rel="stylesheet" href="style.css">
<style>
body{padding-bottom:0;background:var(--soft)}
.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}.top .wrap{display:flex;align-items:center;justify-content:space-between;height:56px;gap:10px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.row{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;gap:12px;align-items:center;margin-bottom:10px}
.row .th{width:72px;height:56px;border-radius:8px;background:var(--soft);object-fit:cover;flex:none;display:flex;align-items:center;justify-content:center;font-size:10px;color:#aaa}
.row .info{flex:1;min-width:0}.row .info b{display:block}.row .info small{color:var(--mut)}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.sm{padding:6px 12px;font-size:13px}
.chipx{font-size:11px;border-radius:999px;padding:2px 8px;border:1px solid var(--line);background:var(--soft);margin-left:6px}
.chipx.off{color:#b00020;border-color:#e8b4bc}
.fld{margin-bottom:6px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}@media(max-width:600px){.grid2{grid-template-columns:1fr}.row{flex-wrap:wrap}}
.photos{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.ph{position:relative;width:92px}.ph img{width:92px;height:70px;object-fit:cover;border-radius:8px;display:block}.ph button{font-size:11px;padding:3px 6px;margin-top:3px;width:100%}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:14px;background:#111;color:#fff;padding:10px 16px;border-radius:10px;z-index:99;font-size:14px;max-width:90vw}.toast.bad{background:#b00020}
.login{max-width:380px;margin:60px auto}.hint{color:var(--mut);font-size:13px}
.note{width:100%;margin-top:6px;padding:8px;font-size:13px}
</style>
</head>
<body>
<div id="app"></div>
<script src="config.js"></script><script src="admin.js"></script>
</body></html>
